<!-- *ngIf 根據條件動態地添加或移除 DOM 元素 -->
<div class="containar p-3">
  <section class="login text-center rounded">
    <div *ngIf="!userName">
      <div class="row">
        <div class="login-text m-auto col-lg-5 col-sm-12">
          <img class="mb-4 lh-lg" src="/assets/logo.svg" alt="logo">
          <h3>立即登入&nbsp;!</h3>
          <h3>開始撰寫影評吧&nbsp;!</h3>
        </div>

        <div class="form-login col-lg-7 col-sm-12">
          <form [formGroup]="loginForm" (ngSubmit)="onSubmitLoginBtn()">
            <label for="email">帳號</label>
            <input id="email" type="text" formControlName="email" placeholder="請輸入信箱">

            <label for="password">密碼</label>
            <div class="password-container">
              <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
                placeholder="請輸入密碼" class="form-control">

              <span class="password-eye" (click)="onClickEyeBtn()">
                <i *ngIf="!showPassword" class="fas fa-eye-slash"></i>
                <i *ngIf="showPassword" class="fas fa-eye"></i>
              </span>
            </div>

            <div *ngIf="loginError" class="pt-3">
              <p>登入失敗，請輸入正確的帳號密碼。</p>
            </div>

            <div *ngIf="loginForm.get('email')?.hasError('email')" class="pt-3">
              請輸入正確的信箱格式
            </div>

            <div class="button">
              <button type="submit" class="btn btn-primary new-btn mt-5" [disabled]="loginForm.invalid">登入</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
</div>
