<article class="container mt-7" style="max-width: 760px">
  <section class="movie-details row">
    <div class="col-12">
      <h2 class="fs-3">✎ 電影影評 | {{movieDetails.name}}</h2>
      <h2 class="fs-4">電影金句 :「{{movieDetails.focus}}」</h2>
    </div>
  </section>

  <section class="details-pic mb-2 ml-4 d-flex justify-content-center">
    <img class="img-fluid rounded" [src]="movieDetails.photo" alt="{{movieDetails.name}}">
  </section>

  <section class="text-end">
    <div class="col-12">
      <p class="fs-6">✎ 作者 : {{movieDetails.author}} / 更新時間 : {{movieDetails.updateTime}}</p>
    </div>
  </section>

  <section class="details-post my-4 fs-3-5 text-left lh-lg">
    <div class="col-12">
      <pre class="fs-6 content-text">{{movieDetails.content}}</pre>
    </div>
  </section>

  <section class="button">
    <a [routerLink]="['/']">
      <button class="btn btn-primary new-btn">返回上一篇</button>
    </a>
  </section>
</article>
