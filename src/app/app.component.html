<section class="header d-flex justify-content-between">
  <a [routerLink]="['/']">
    <img class="home-logo m-2-5" src="/assets/logo.svg" alt="logo">
  </a>

  <ng-container *ngIf="getUser$() | async as user">
    <!-- 如果 user.id != 0，顯示會員資訊和登出按鈕 -->
    <ng-container *ngIf="user.id !== 0">
      <div>
        <a [routerLink]="['/articleManagement']">
          <img class="headerlogo m-2-5" [src]="user.picture" alt="logo">
          <span>{{ user.username }}</span>
        </a>
        <button (click)="onClickLogoutBtn()" class="btn btn-primary new-btn m-2-5 px-3">登出</button>
      </div>
    </ng-container>

    <!-- 如果 user.id === 0 且不是登入頁面，顯示登入按鈕  // 改成函式 帶韓式 -->
    <ng-container *ngIf="user.id === 0 && !isLoginPage()">
      <button (click)="router.navigate(['/login'])" class="btn btn-primary new-btn m-2-5 px-3">登入</button>
    </ng-container>
  </ng-container>
</section>

<section>
  <router-outlet></router-outlet>
</section>
