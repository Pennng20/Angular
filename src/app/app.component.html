<section class="header d-flex justify-content-between">
  <a [routerLink]="['/']">
    <img class="home-logo m-2-5" src="/assets/logo.svg" alt="logo">
  </a>

  <ng-container *ngIf="user$ | async as user; else login">
    <div class="header-group">
      <img class="m-2-5" [src]="user.picture" alt="logo">
      <span>{{ user.username }}</span>
      <button (click)="onClickLogoutBtn()" class="btn btn-primary new-btn m-2-5 px-3">登出</button>
    </div>
  </ng-container>

  <ng-template #login>
    <button (click)="router.navigate(['/login'])" class="btn btn-primary new-btn m-2-5 px-3">登入</button>
  </ng-template>
</section>

<section>
  <router-outlet></router-outlet>
</section>
