<ngb-carousel [interval]="3000">
  <ng-template ngbSlide>
    <div class="picsum-img-wrapper w-100">
      <img [src]="images[0]" alt="First slide" class="img-fluid" />
    </div>
  </ng-template>
  <ng-template ngbSlide>
    <div class="picsum-img-wrapper w-100">
      <img [src]="images[1]" alt="Second slide" class="img-fluid" />
    </div>
  </ng-template>
  <ng-template ngbSlide>
    <div class="picsum-img-wrapper w-100">
      <img [src]="images[2]" alt="Third slide" class="img-fluid" />
    </div>
  </ng-template>
</ngb-carousel>

<section class="home-title">
  <h2>☾ 最新文章 ☽</h2>
</section>

<section class="results">
  <div class="container">
    <div class="row">
      <app-movielocation *ngFor="let movie of movieList | slice:0:5" class="col-12 mb-4" [moviePost]="movie">
      </app-movielocation>
    </div>
  </div>
</section>

<section class="home-btn">
  <a [routerLink]="['/allmovie']">
    <button class="allpost">閱讀更多</button>
  </a>
</section>
